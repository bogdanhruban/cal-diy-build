# Example nginx server block for a Cal.diy container named `calcom` on the same Docker network.
server {
    listen 443 ssl;
    http2 on;
    server_name cal.example.com;

    ssl_certificate     /etc/nginx/certs/cal.example.com.pem;
    ssl_certificate_key /etc/nginx/certs/cal.example.com.key;

    # Allow embedding only from your own site(s). Do not add a global X-Frame-Options here.
    add_header Content-Security-Policy "frame-ancestors 'self' https://www.example.com" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 10m;
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;

    # Defence in depth for the `nosignup` flavor.
    location ~ ^/(signup|api/auth/signup)(/|$) { return 404; }

    location / {
        resolver 127.0.0.11 valid=30s;   # Docker DNS; re-resolves when the container is recreated
        set $calcom calcom:3000;
        proxy_pass http://$calcom;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
