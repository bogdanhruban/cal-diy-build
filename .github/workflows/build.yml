name: build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream commit SHA to build (full 40 characters)"
        required: true
      upstream:
        description: "Upstream repository"
        required: true
        default: calcom/cal.diy
      flavor:
        description: "nosignup = public sign-up disabled at build time; signup = upstream default"
        type: choice
        options: [nosignup, signup]
        default: nosignup
      image:
        description: "Target image name (empty = ghcr.io/<owner>/cal-diy)"
        required: false
        default: ""
      push:
        description: "Push the image after the smoke test passes"
        type: boolean
        default: true
      apply_patches:
        description: "Apply patches/*.patch (minimal upstream bug fixes) to the upstream source"
        type: boolean
        default: true
  workflow_call:
    inputs:
      ref:
        description: "Upstream commit SHA to build (full 40 characters)"
        type: string
        required: true
      upstream:
        description: "Upstream repository"
        type: string
        default: calcom/cal.diy
      flavor:
        description: "nosignup = public sign-up disabled at build time; signup = upstream default"
        type: string
        default: nosignup
      image:
        description: "Target image name (empty = ghcr.io/<owner>/cal-diy)"
        type: string
        default: ""
      push:
        description: "Push the image after the smoke test passes"
        type: boolean
        default: true
      apply_patches:
        description: "Apply patches/*.patch (minimal upstream bug fixes) to the upstream source"
        type: boolean
        default: true
    outputs:
      image:
        description: "Image name without tag, e.g. ghcr.io/<owner>/cal-diy"
        value: ${{ jobs.build.outputs.image }}
      tag:
        description: "Image tag, e.g. <sha10>-nosignup-p-r<run>"
        value: ${{ jobs.build.outputs.tag }}
      digest:
        description: "Manifest digest (sha256:...); empty when push is false"
        value: ${{ jobs.build.outputs.digest }}
      pinned:
        description: "image:tag@digest; empty when push is false"
        value: ${{ jobs.build.outputs.pinned }}
      patches_json:
        description: 'JSON array of {"name": "<file>.patch", "status": "applied|upstreamed|failed"}'
        value: ${{ jobs.build.outputs.patches_json }}

permissions:
  contents: read
  packages: write

concurrency:
  group: build-${{ inputs.flavor }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      image: ${{ steps.in.outputs.image }}
      tag: ${{ steps.tag.outputs.tag }}
      digest: ${{ steps.push.outputs.digest }}
      pinned: ${{ steps.push.outputs.pinned }}
      patches_json: ${{ steps.patches.outputs.json }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: calcom
          POSTGRES_PASSWORD: calcom
          POSTGRES_DB: calcom
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U calcom" --health-interval 5s --health-timeout 5s --health-retries 30

    steps:
      - name: Validate inputs
        id: in
        env:
          REF: ${{ inputs.ref }}
          UPSTREAM: ${{ inputs.upstream }}
          FLAVOR: ${{ inputs.flavor }}
          IMAGE_IN: ${{ inputs.image }}
          OWNER: ${{ github.repository_owner }}
        run: |
          [[ "$REF" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::ref must be a full 40-character commit SHA"; exit 1; }
          [[ "$UPSTREAM" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || { echo "::error::upstream must be owner/repo"; exit 1; }
          [[ "$FLAVOR" =~ ^(nosignup|signup)$ ]] || { echo "::error::flavor must be nosignup or signup"; exit 1; }
          image="${IMAGE_IN:-ghcr.io/${OWNER,,}/cal-diy}"
          [[ "$image" =~ ^[a-z0-9./_-]+$ ]] || { echo "::error::invalid image name: $image"; exit 1; }
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af >/dev/null
          df -h / ; free -h ; nproc

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Checkout upstream
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ inputs.upstream }}
          ref: ${{ inputs.ref }}
          path: src
          persist-credentials: false

      # Each patch is classified against the upstream checkout:
      #   applied    - applies cleanly; applied.
      #   upstreamed - applies in reverse, i.e. upstream already contains the change; skipped.
      #   failed     - neither; the build fails after all patches have been classified.
      - name: Apply patches
        id: patches
        env:
          APPLY: ${{ inputs.apply_patches }}
        run: |
          set -euo pipefail
          results='[]'; applied=""; failed=0
          if [ "$APPLY" = true ]; then
            shopt -s nullglob
            for p in patches/*.patch; do
              name=$(basename "$p"); abs="$GITHUB_WORKSPACE/$p"
              echo "::group::$name"
              if git -C src apply --check "$abs" 2>/dev/null; then
                git -C src apply --verbose "$abs"
                status=applied; applied="${applied:+$applied,}${name%.patch}"
              elif git -C src apply --reverse --check "$abs" 2>/dev/null; then
                status=upstreamed
                echo "::warning title=Patch upstreamed::$name is already contained in upstream; skipped. Remove it from patches/."
              else
                status=failed; failed=1
                git -C src apply --check --verbose "$abs" || true
                echo "::error title=Patch does not apply::$name applies neither forwards nor in reverse; refresh or drop it."
              fi
              echo "::endgroup::"
              echo "$name: $status"
              results=$(jq -c --arg n "$name" --arg s "$status" '. + [{name: $n, status: $s}]' <<<"$results")
            done
          fi
          echo "json=$results" >> "$GITHUB_OUTPUT"
          echo "applied=${applied:-none}" >> "$GITHUB_OUTPUT"
          git -C src status --short
          {
            echo "### Patches"; echo
            if [ "$results" = '[]' ]; then echo "none"; else
              echo "| Patch | Status |"; echo "|---|---|"
              jq -r '.[] | "| `\(.name)` | \(.status) |"' <<<"$results"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$failed" -eq 0 ]

      - name: Image tag
        id: tag
        env:
          IMAGE: ${{ steps.in.outputs.image }}
          REF: ${{ inputs.ref }}
          FLAVOR: ${{ inputs.flavor }}
          APPLIED: ${{ steps.patches.outputs.applied }}
          RUN_NO: ${{ github.run_number }}
        run: |
          suffix=""; [ "$APPLIED" != none ] && suffix="-p"
          tag="${REF:0:10}-$FLAVOR$suffix-r$RUN_NO"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "full=$IMAGE:$tag" >> "$GITHUB_OUTPUT"
          echo "Image: $IMAGE:$tag"

      - name: Build-time placeholders (Next.js reads apps/web/.env.production during next build)
        env:
          FLAVOR: ${{ inputs.flavor }}
        run: |
          test ! -e src/apps/web/.env.production || { echo "::error::upstream ships apps/web/.env.production; review before overwriting"; exit 1; }
          {
            echo "NEXT_PUBLIC_APP_NAME=__CALDIY_RT_APP_NAME__"
            echo "NEXT_PUBLIC_COMPANY_NAME=__CALDIY_RT_COMPANY_NAME__"
            echo "NEXT_PUBLIC_SUPPORT_MAIL_ADDRESS=__CALDIY_RT_SUPPORT_MAIL_ADDRESS__"
            if [ "$FLAVOR" = nosignup ]; then echo "NEXT_PUBLIC_DISABLE_SIGNUP=true"; fi
          } > src/apps/web/.env.production
          cat src/apps/web/.env.production

      - name: Build upstream Dockerfile (unmodified)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: src
          platforms: linux/amd64
          load: true
          push: false
          tags: cal-diy-base:local
          build-args: |
            NEXT_PUBLIC_WEBAPP_URL=http://NEXT_PUBLIC_WEBAPP_URL_PLACEHOLDER
            NEXT_PUBLIC_WEBSITE_TERMS_URL=__CALDIY_RT_WEBSITE_TERMS_URL__
            NEXT_PUBLIC_WEBSITE_PRIVACY_POLICY_URL=__CALDIY_RT_WEBSITE_PRIVACY_POLICY_URL__
            NEXT_PUBLIC_LICENSE_CONSENT=agree
            CALCOM_TELEMETRY_DISABLED=1
            DATABASE_URL=postgresql://build:build@localhost:5432/build

      - name: Add runtime layer
        env:
          TAG: ${{ steps.tag.outputs.full }}
          REF: ${{ inputs.ref }}
          UPSTREAM: ${{ inputs.upstream }}
          FLAVOR: ${{ inputs.flavor }}
          PATCHES: ${{ steps.patches.outputs.applied }}
          SRC: ${{ github.server_url }}/${{ github.repository }}
        run: |
          docker build -f Dockerfile.runtime --build-arg BASE=cal-diy-base:local \
            --label org.opencontainers.image.source="$SRC" \
            --label org.opencontainers.image.revision="$REF" \
            --label org.opencontainers.image.title="cal-diy" \
            --label org.opencontainers.image.description="Cal.diy ($UPSTREAM@$REF, flavor $FLAVOR, patches $PATCHES) with runtime-configurable URL" \
            --label org.opencontainers.image.licenses=MIT \
            --label io.github.cal-diy-build.upstream="$UPSTREAM" \
            --label io.github.cal-diy-build.flavor="$FLAVOR" \
            --label io.github.cal-diy-build.patches="$PATCHES" \
            -t "$TAG" .

      - name: Static checks
        env:
          TAG: ${{ steps.tag.outputs.full }}
        run: |
          docker run --rm --entrypoint bash "$TAG" -c '
            set -euo pipefail; cd /calcom; node -v
            n() { { grep -rlE "$1" apps/web/.next apps/web/public 2>/dev/null || true; } | wc -l; }  # 0 matches must not trip pipefail
            echo "env NEXT_PUBLIC_WEBAPP_URL=$NEXT_PUBLIC_WEBAPP_URL"
            p=$(n "http://NEXT_PUBLIC_WEBAPP_URL_PLACEHOLDER"); echo "WEBAPP_URL placeholder files: $p"; [ "$p" -gt 0 ]
            r=$(n "__CALDIY_RT_[A-Z_]+__"); echo "runtime placeholder files: $r"; [ "$r" -gt 0 ]
            e=$(find apps/web -name .env.production -not -path "*/node_modules/*" | wc -l); echo ".env.production left: $e"; [ "$e" -eq 0 ]
          '

      - name: Smoke test (runtime substitution, migrations, restart)
        env:
          TAG: ${{ steps.tag.outputs.full }}
        run: |
          set -euo pipefail
          docker run -d --name smoke --network host \
            -e NEXT_PUBLIC_WEBAPP_URL=https://cal.example.test \
            -e NEXT_PUBLIC_APP_NAME="Smoke Test Booking" \
            -e NEXTAUTH_SECRET="$(openssl rand -base64 32)" \
            -e CALENDSO_ENCRYPTION_KEY="$(openssl rand -base64 24)" \
            -e DATABASE_HOST=localhost:5432 \
            -e DATABASE_URL=postgresql://calcom:calcom@localhost:5432/calcom \
            -e DATABASE_DIRECT_URL=postgresql://calcom:calcom@localhost:5432/calcom \
            -e CALCOM_TELEMETRY_DISABLED=1 \
            -e NEXT_PUBLIC_DISABLE_SIGNUP=true \
            "$TAG"
          wait_up() {
            for i in $(seq 1 90); do
              [ "$(docker inspect -f '{{.State.Running}}' smoke)" = true ] || { echo "::error::container exited"; return 1; }
              curl -fsS -o /dev/null --max-time 5 http://127.0.0.1:3000/api/version && { echo "up after $((i*10))s"; return 0; }
              sleep 10
            done
            echo "::error::not up after 900s"; return 1
          }
          wait_up
          docker exec smoke bash -c '
            set -euo pipefail; cd /calcom
            n() { { grep -rlE "$1" apps/web/.next apps/web/public 2>/dev/null || true; } | wc -l; }  # 0 matches must not trip pipefail
            left=$(n "__CALDIY_RT_[A-Z_]+__|http://NEXT_PUBLIC_WEBAPP_URL_PLACEHOLDER"); echo "placeholders left: $left"; [ "$left" -eq 0 ]
            u=$({ grep -rl "cal.example.test" apps/web/.next/static 2>/dev/null || true; } | wc -l); echo "runtime URL in client bundle: $u files"; [ "$u" -gt 0 ]
            a=$(n "Smoke Test Booking"); echo "runtime APP_NAME: $a files"; [ "$a" -gt 0 ]
          '
          # start-web.sh: next-server is PID 1 and no yarn/turbo wrapper is left running.
          docker exec smoke bash -c '
            set -euo pipefail
            p1=$(tr "\0" " " </proc/1/cmdline); echo "PID 1: $p1"; [[ $p1 == next-server* ]]
            ps -eo pid,rss,args
            # [x] brackets: the pattern must not match this bash -c command line itself.
            w=$(for p in /proc/[0-9]*; do tr "\0" " " <"$p/cmdline" 2>/dev/null; echo; done | grep -cE "yar[n]\.js|yar[n]-[0-9.]+\.cjs|tur[b]o run" || true)
            echo "yarn/turbo processes: $w"; [ "$w" -eq 0 ]
          '
          echo "GET /api/version: $(curl -s http://127.0.0.1:3000/api/version)"
          echo "GET /auth/login: $(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/auth/login) (info)"
          sp=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/signup); echo "GET /signup (sign-up disabled at runtime): $sp"; [ "$sp" = 307 ]
          sa=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"email":"a@example.test","username":"a","password":"Aa1aaaaaaaaaaaaaaa"}' http://127.0.0.1:3000/api/auth/signup); echo "POST /api/auth/signup: $sa"; [ "$sa" = 403 ]
          docker restart smoke >/dev/null && wait_up
          docker logs smoke 2>&1 | grep -E "runtime-env:" || true
          docker stats --no-stream --format 'memory after start: {{.MemUsage}}' smoke

      - name: Container logs (on failure)
        if: failure()
        run: docker logs smoke 2>&1 | tail -200 || true

      - name: Log in to GHCR
        if: inputs.push
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        id: push
        if: inputs.push
        env:
          TAG: ${{ steps.tag.outputs.full }}
        run: |
          docker push "$TAG"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$TAG" | cut -d@ -f2)
          echo "Pin: $TAG@$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "pinned=$TAG@$digest" >> "$GITHUB_OUTPUT"
          { echo "### Image"; echo; echo "\`$TAG@$digest\`"; } >> "$GITHUB_STEP_SUMMARY"
